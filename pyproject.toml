[project]
name = "chatport"
version = "0.1.1"
description = "Move WhatsApp from Android to the iPhone you already use, without erasing it"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "wamove @ git+https://github.com/rhamaxv/wamove.git@215d799600ac7240a3b2add71a09cc1dde71517a",
    "PySide6>=6.7",
]

[project.scripts]
chatport = "chatport.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.10", "Pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chatport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
