name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: bash packaging/build.sh
            artifact: dist/Chatport-*.dmg
          - os: windows-latest
            build: pwsh packaging/build.ps1
            artifact: dist/Chatport-*-Setup.exe
          - os: ubuntu-22.04
            build: bash packaging/build-appimage.sh
            artifact: dist/Chatport-*-x86_64.AppImage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libgl1 libdbus-1-3
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Ensure Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $have = (Get-Command iscc -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $have) { choco install innosetup -y --no-progress }

      - name: Install Chatport with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: Chatport-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Chatport-*
          path: release
          merge-multiple: true

      - name: List files
        run: ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
