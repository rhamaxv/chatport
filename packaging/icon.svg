<?xml version="1.0" encoding="UTF-8"?>
<!-- Chatport app icon. Master file; packaging/make_icons.py renders every size. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- userSpaceOnUse so the same gradient works as a stroke that blends into the plate -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1024">
      <stop offset="0" stop-color="#1FA37A"/>
      <stop offset="1" stop-color="#157A5B"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square plate -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Back bubble: outlined, tail bottom-left (the Android side) -->
  <path d="M 274 200 H 542 A 96 96 0 0 1 638 296 V 434 A 96 96 0 0 1 542 530 H 266 L 178 626 V 296 A 96 96 0 0 1 274 200 Z"
        fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linejoin="round"/>

  <!-- Front bubble: filled, tail bottom-right (the iPhone side).
       The gradient stroke carves a 26 px gap through the back outline so the bubbles stay separate. -->
  <path d="M 514 440 H 782 A 96 96 0 0 1 878 536 V 866 L 790 770 H 514 A 96 96 0 0 1 418 674 V 536 A 96 96 0 0 1 514 440 Z"
        fill="#FFFFFF" stroke="url(#bg)" stroke-width="52" stroke-linejoin="round"/>

  <!-- Arrow inside the front bubble: chat moving left to right -->
  <polygon points="536,577 688,577 688,513 772,605 688,697 688,633 536,633" fill="#157A5B"/>
</svg>
